org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# Optional: Increase timeout for slow connections
systemProp.gradle.internal.http.connectionTimeout=600000
systemProp.gradle.internal.http.socketTimeout=600000

# Disable Kotlin incremental compilation to avoid Windows-cross-drive incremental cache errors
# See: https://youtrack.jetbrains.com/issue/KT-xxxxx and common Gradle/Kotlin issues on Windows
kotlin.incremental=false

